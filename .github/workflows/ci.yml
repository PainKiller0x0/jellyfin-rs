name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.15.1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test

      - name: Build
        run: cargo build --release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm build

  smartstrm-contract:
    name: SmartStrm contract fixture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run local SmartStrm protocol fixture
        run: python -m unittest discover -s tests/smartstrm_contract -p "test_*.py"

  dockerhub:
    name: Docker Hub
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    # Docker publishing is opt-in. Set the repository variable
    # DOCKERHUB_PUBLISH=true after configuring the Docker Hub secrets.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      vars.DOCKERHUB_PUBLISH == 'true'

    concurrency:
      group: dockerhub-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "Docker Hub credentials are not configured; skipping image publish."
          fi

      - name: Set up Docker Buildx
        if: steps.credentials.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.credentials.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Compute image version
        if: steps.credentials.outputs.available == 'true'
        id: version
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || vars.DOCKER_IMAGE }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "DOCKERHUB_USERNAME secret is required" >&2
            exit 1
          fi

          repo="${DOCKERHUB_REPOSITORY:-}"
          if [ -z "${repo}" ]; then
            repo="${DOCKERHUB_USERNAME}/${GITHUB_REPOSITORY#*/}"
          elif [[ "${repo}" != */* ]]; then
            repo="${DOCKERHUB_USERNAME}/${repo}"
          fi

          base="$(TZ=Asia/Shanghai date '+%y.%-m.%-d')"
          tags_url="https://hub.docker.com/v2/repositories/${repo}/tags?page_size=100&name=${base}"
          tags_json="$(curl -fsSL "${tags_url}" || printf '{"results":[]}')"

          version="$(
            BASE="${base}" TAGS_JSON="${tags_json}" python3 <<'PY'
          import json
          import os
          import re

          base = os.environ["BASE"]
          try:
              data = json.loads(os.environ.get("TAGS_JSON", "{}"))
          except json.JSONDecodeError:
              data = {"results": []}

          max_suffix = -1
          pattern = re.compile(r"^" + re.escape(base) + r"(?:-(\d+))?$")
          for item in data.get("results", []):
              name = item.get("name", "")
              match = pattern.match(name)
              if not match:
                  continue
              suffix = int(match.group(1) or 0)
              max_suffix = max(max_suffix, suffix)

          print(base if max_suffix < 0 else f"{base}-{max_suffix + 1}")
          PY
          )"

          echo "image=${repo}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Docker image: ${repo}:${version}"

      - name: Build and push
        if: steps.credentials.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
