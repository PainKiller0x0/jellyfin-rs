[package]
name = "jellyfin-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpu = "0.2.0"
fastrand = "2.5"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls", "gzip", "brotli", "stream"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio", "sqlx-postgres", "macros"] }
tokio = { version = "1.53", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24", features = ["v4", "v5", "serde"] }
walkdir = "2.5"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
dashmap = "6"
xdb-parse = "0.2"
bdinfo-rs-core = "2.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
