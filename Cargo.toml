[package]
name = "jellyfin-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fastrand = "2.3"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "1.1", features = ["runtime-tokio", "sqlx-postgres", "sqlx-sqlite", "macros"] }
sqlx = { version = "0.8", features = ["migrate", "sqlite"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
walkdir = "2.5"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
